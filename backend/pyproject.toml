[project]
name = "truetinfoilhat"
version = "0.1.0"
description = "Semáforo para la letra pequeña: clasifica cláusulas de ToS/privacidad y compara versiones con Wayback Machine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "rapidfuzz>=3.9",
    "anthropic>=0.60",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
